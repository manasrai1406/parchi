# Local development stack.
name: parchi

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parchi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parchi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parchi
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parchi_test
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/uploads
      LOG_DIR: /app/logs
      # File-change events do not reach containers from Windows or macOS drives: poll.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn parchi.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
      - ./data/uploads:/data/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parchi
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/uploads
      LOG_DIR: /app/logs
      WATCHFILES_FORCE_POLLING: "true"
    # Reloads when backend code changes. The API runs the migrations first.
    command: arq --watch src parchi.worker.WorkerSettings
    volumes:
      - ./backend/src:/app/src
      - ./data/uploads:/data/uploads
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:

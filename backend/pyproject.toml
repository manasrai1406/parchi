[project]
name = "parchi"
version = "0.1.0"
description = "Receipt ingestion, extraction, validation and review"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "arq>=0.26",
    "redis>=5.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "xlrd>=2.0.2",
    "reportlab>=5.0.1",
    "pypdfium2>=5.13.0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.7,<3.8",
    "paddlepaddle>=3.3,<3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parchi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]
"migrations/**" = ["E501", "S608"]
